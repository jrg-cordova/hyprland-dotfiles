preload = /home/jorge/pictures/wal/wal1.jpg
wallpaper = DP-3,/home/jorge/pictures/wal/wal1.jpg

#===========
# PROGRAMAS
#===========
$terminal = kitty

#=====================================
# PROGRAMAS QUE INICIAN AUTOMATICAMENTE
#======================================
exec-once = waybar
exec-once = swaync
exec-once = awww-daemon
exec-once = awww img /home/jorge/pictures/wal/wal1.jpg
#========================
# MONITORES
#========================

#monitor=,preferred,auto,auto
# monitor=,preferred,auto,auto
monitor=DP-3, 1920x1080@144, 0x0, 1

#====================================
# VARIABLES
#====================================
$mainMod = SUPER

#===================================
# ATAJOS DE TECLADO (KEYBINDINGS)
#===================================
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, W, exec, brave
bind = $mainMod, Q, killactive,
bind = $mainMod SHIFT, Q, exit
bind = $mainMod,D, exec, rofi -show drun

# Alternar la ventana activa entre Tile y Float
bind = $mainMod, V, togglefloating,

# Mover y redimensionar ventanas flotantes con el raton
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Cambiar al workspace (Super + Número)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Mover ventanas de lugar
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# Mover ventana activa al workspace (Super + Shift + Número)
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Cambiar de workspace con Super + Scroll del mouse
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# ----- CAPTURAS DE PANTALLA -----
# Area + editor estilo "Recortes" de Windows (copia y click para editar en swappy)
bind = $mainMod SHIFT, S, exec, ~/.config/hypr/scripts/screenshot-snip.sh
# Pantalla completa (Guardar y Portapapeles)
bind = , Print, exec, ~/.local/bin/screenshot-full
# Ventana activa (como Alt+PrintScreen)
bind = $mainMod, Print, exec, ~/.config/hypr/scripts/screenshot-window.sh

# ----- CAMARA / WEBCAM FLOTANTE (estilo streamer) -----
bind = $mainMod SHIFT, C, exec, ~/.config/hypr/scripts/webcam-toggle.sh

# ----- GRABACION DE PANTALLA (video + mic + sistema) -----
bind = $mainMod SHIFT, R, exec, ~/.config/hypr/scripts/record-toggle.sh

# Lanzar Kali Linux con SUPER + ALT + K
bind = $mainMod ALT, K, exec, virsh start Kali && virt-viewer --connect qemu:///system Kali
#===================================
# Variables de entorno para NVIDIA
#===================================

env = LIBVA_DRIVER_NAME,nvidia
env = XDG_SESSION_TYPE,wayland
#env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia

#===================================
# CONFIGURACION BASICA DE HARDWARE
#===================================
general {
	col.active_border = rgba(4C566Aee)
	col.inactive_border = rgba(2E3440ee)
}

misc {
	disable_hyprland_logo = true
	force_default_wallpaper = 0
}

cursor {
	no_hardware_cursors = true
}





input {
	kb_layout = us
	kb_variant =
	kb_model =
	kb_options =
	kb_rules =
	follow_mouse = 1
}

decoration {
	rounding = 8

	blur {
		enabled = true
		size = 6
		passes = 3
		new_optimizations = true
	}
}


windowrule = match:class ^(kitty)$, opacity 0.85 0.85 

# ==========================================
# REGLAS DE VENTANAS FLOTANTES (SINTAXIS 0.53+)
# ==========================================

windowrule = match:class ^(pavucontrol)$, float on, size 700 400, center on

windowrule = match:class ^(qalculate-gtk)$, float on

# Webcam flotante (estilo streamer): flota, esquina inferior derecha, anclada y siempre visible
windowrule = match:title ^(webcam-float)$, float on, size 480 270, move 1420 760, pin on

windowrule = match:class ^(xdg-desktop-portal-gtk)$, float on
windowrule = match:class ^(xdg-desktop-portal-kde)$, float on

windowrule = match:title (.*)(Guardar)(.*), float on
windowrule = match:title (.*)(Abrir)(.*), float on
windowrule = match:title (.*)(Save)(.*), float on
windowrule = match:title (.*)(Open)(.*), float on
